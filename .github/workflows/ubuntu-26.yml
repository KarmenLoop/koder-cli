name: Ubuntu 26.04.1 Desktop amd64 compatibility
on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact draft or published release tag
        required: true
        default: cli-0.5.13
permissions:
  contents: read
jobs:
  ubuntu26:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: write # Required to download draft assets; no publication steps.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the actual guest version and architecture
        run: |
          mkdir -p ubuntu-results
          cat /etc/os-release | tee ubuntu-results/os-release.txt
          uname -a | tee ubuntu-results/uname.txt
          python3 - <<'PYOS'
          import platform
          from pathlib import Path
          release=platform.freedesktop_os_release()
          assert release['ID']=='ubuntu' and release['VERSION_ID']=='26.04', release
          assert '26.04.1' in release['PRETTY_NAME'], release
          assert platform.machine()=='x86_64', platform.machine()
          PYOS
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install disposable desktop dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core dbus-x11 libnotify-bin sway mako-notifier
      - name: Download exact release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern "koder-cli-${RELEASE_TAG#cli-}-linux.tgz" --pattern 'koder-cli-latest.json' --pattern 'koder-cli.sh' --pattern 'koder-ubuntu-24.04.sh'
          printf 'KODER_TEST_VERSION=%s\n' "${RELEASE_TAG#cli-}" >> "$GITHUB_ENV"
      - name: Install, update, launch and inspect the full runtime
        run: python3 .github/scripts/ubuntu-runtime-check.py
      - name: Submit and cancel tasks in a real PTY
        run: python3 .github/scripts/ubuntu-task-check.py
      - name: Exercise Wayland accessibility controls and notifications
        env:
          KODER_DISPLAY_TEST: wayland
        run: dbus-run-session -- bash .github/scripts/ubuntu-desktop-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-26.04.1-amd64
          path: |
            ubuntu-results/
            ubuntu-task-results/
          retention-days: 14
