name: Frozen 0.4.11 install update and bundled MCP acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  install-update:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {name: win-server-cmd, os: windows-latest, mode: cold, entry: cmd, arch: x64}
          - {name: win-server-ps51, os: windows-latest, mode: cold, entry: powershell, arch: x64}
          - {name: win-server-update, os: windows-latest, mode: upgrade, entry: powershell, arch: x64}
          - {name: win11-arm-cmd, os: windows-11-arm, mode: cold, entry: cmd, arch: arm64}
          - {name: win11-arm-ps51, os: windows-11-arm, mode: cold, entry: powershell, arch: arm64}
          - {name: win11-arm-update, os: windows-11-arm, mode: upgrade, entry: powershell, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify frozen 0.4.11 and optional 0.4.10 baseline
        run: python .github/probes/fetch-0411.py ${{ matrix.mode }}
      - name: Native no-Node install or original installed updater
        run: python .github/probes/published-install-matrix.py --mode ${{ matrix.mode }} --entry ${{ matrix.entry }} --expected-platform win32 --expected-arch ${{ matrix.arch }} --assets "%RUNNER_TEMP%/koder-0411-input/0.4.11" --baseline-assets "%RUNNER_TEMP%/koder-0411-input/0.4.10" --out "%RUNNER_TEMP%/koder-0411-result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 0411-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/koder-0411-result/receipt.json
            ${{ runner.temp }}/koder-0411-result/*.raw
          retention-days: 14
  bundled-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: x64
      - name: Fetch exact published runtime
        run: python .github/probes/fetch-0411.py cold
      - name: Install pinned test-client dependencies in owned venv
        run: |
          python -m venv "%RUNNER_TEMP%/koder-0411-gui/runtime"
          "%RUNNER_TEMP%/koder-0411-gui/runtime/Scripts/python.exe" -m pip install --disable-pip-version-check --only-binary=:all: --timeout 20 --retries 1 windows-mcp==0.8.8
      - name: Actual bundled server and original Agent with two owned GUI windows
        run: '"%RUNNER_TEMP%/koder-0411-gui/runtime/Scripts/python.exe" .github/probes/mcp-gui-bundled-0411.py --root "%RUNNER_TEMP%/koder-0411-gui" --package "%RUNNER_TEMP%/koder-0411-input/0.4.11/koder-cli-0.4.11.tgz" --sha256 7d56d6520421a301f93dc22d0af4a00bc9bc95cf5613a440ee2ae4def7188136 --version 0.4.11'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 0411-bundled-gui-server
          path: ${{ runner.temp }}/koder-0411-gui/evidence
          retention-days: 14
