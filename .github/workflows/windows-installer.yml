name: Frozen 0.4.0 Windows cold and GUI acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  no-node:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        entry: [cmd, powershell]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use the image Python without installing or starting PowerShell
        run: python --version
      - name: Prepare exact published installer bytes without target startup
        run: python .github/probes/prepare-native.py --root "%RUNNER_TEMP%\koder-cold-input"
      - name: First installer invocation with no discoverable Node
        run: python .github/probes/windows-no-node.py --entry ${{ matrix.entry }} --assets "%RUNNER_TEMP%\koder-cold-input\assets" --out "%RUNNER_TEMP%\koder-cold-result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-${{ matrix.os }}-${{ matrix.entry }}
          path: |
            ${{ runner.temp }}/koder-cold-input/evidence
            ${{ runner.temp }}/koder-cold-result/receipt.json
            ${{ runner.temp }}/koder-cold-result/*.raw
          retention-days: 14
  credential:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use the image Python without installing or starting PowerShell
        run: python --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: x64
      - name: Fetch exact package without invoking PowerShell
        run: python .github/probes/prepare-native.py --root "%RUNNER_TEMP%\koder-credential-input" --extract
      - name: First real PS5 fallback persistence and cross-process read
        run: node .github/probes/credential-cold.mjs --package-root "%RUNNER_TEMP%\koder-credential-input\package\koder-cli" --out "%RUNNER_TEMP%\koder-credential-result" --mode ps51
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/koder-credential-input/evidence
            ${{ runner.temp }}/koder-credential-result/receipt.json
            ${{ runner.temp }}/koder-credential-result/*.raw
            ${{ runner.temp }}/koder-credential-result/read-process/receipt.json
            ${{ runner.temp }}/koder-credential-result/read-process/*.stderr.raw
          retention-days: 14
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: x64
      - name: Fetch exact release
        run: python .github/probes/prepare-native.py --root "%RUNNER_TEMP%\koder-gui"
      - name: Install the pinned MCP dependency in the owned environment
        run: |
          python -m venv "%RUNNER_TEMP%\koder-gui\runtime"
          "%RUNNER_TEMP%\koder-gui\runtime\Scripts\python.exe" -m pip install --disable-pip-version-check --only-binary=:all: --timeout 20 --retries 1 --report "%RUNNER_TEMP%\koder-gui\install-report.json" windows-mcp==0.8.8
      - name: Actual Koder-mediated GUI interaction with owned targets
        run: '"%RUNNER_TEMP%\koder-gui\runtime\Scripts\python.exe" .github/probes/mcp-gui.py --root "%RUNNER_TEMP%\koder-gui" --package "%RUNNER_TEMP%\koder-gui\assets\koder-cli-0.4.0.tgz" --sha256 86b6071c224437298a01e4b909d07fd1d91826b348fab181a8a50209eb390566 --version 0.4.0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/koder-gui/evidence
            ${{ runner.temp }}/koder-gui/install-report.json
          retention-days: 14
