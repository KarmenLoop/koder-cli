name: Packaged release acceptance
on:
  workflow_dispatch:
    inputs:
      release:
        description: Draft or published release tag
        required: true
        default: cli-0.4.0-preview.30
      phase:
        type: choice
        options: [windows-vm-install, windows-vm-runtime, windows-vm-diagnose, stable-candidate, published, candidate, candidate-windows, candidate-focused, negative, startup-repeat, animation-repeat, windows-diagnosis, windows-app-diagnosis, animation-diagnosis, memory-public]
        default: published
      assets_ref:
        description: Reserved for older installer-only runs
        required: false
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows-vm:
    permissions:
      contents: write # GitHub requires this to read draft release assets; the job does not upload.
    if: inputs.phase == 'windows-vm-install' || inputs.phase == 'windows-vm-runtime' || inputs.phase == 'windows-vm-diagnose'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - name: Download the published Windows package and installer manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern 'koder-cli-latest.json' --pattern 'koder-cli.ps1' --pattern 'koder-cli.cmd' --pattern 'koder-cli.sh' --pattern 'koder-ubuntu-24.04.sh'
          PACKAGE=$(node -p 'JSON.parse(require("fs").readFileSync("candidate/koder-cli-latest.json")).file')
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern "$PACKAGE"
      - name: Record the actual VM environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vm-results | Out-Null
          @{os=[System.Environment]::OSVersion.VersionString; architecture=$env:PROCESSOR_ARCHITECTURE; pwsh=$PSVersionTable.PSVersion.ToString(); node=(node --version); release='${{ inputs.release }}'; revision='${{ github.sha }}'; scope='Windows Server VM; no physical Windows 10/11 or visible-desktop acceptance'} | ConvertTo-Json | Set-Content vm-results/environment.json
      - name: Exercise the real PowerShell 5.1 and CMD installers in ConPTY
        if: inputs.phase == 'windows-vm-install'
        run: python .github/scripts/test-windows-installer.py --assets candidate --out vm-results --public-download
      - name: Exercise the installed Windows runtime
        if: inputs.phase == 'windows-vm-runtime'
        run: python .github/scripts/windows-vm-runtime.py --assets candidate --out vm-results
      - name: Diagnose the failed session timing gate and unknown Toast receipt
        if: inputs.phase == 'windows-vm-diagnose'
        run: python .github/scripts/windows-vm-runtime.py --assets candidate --out vm-results --diagnose
      - name: Preserve receipts and terminal logs, including failed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.phase }}-${{ inputs.release }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            vm-results/*.json
            vm-results/*.log
            vm-results/*.tap
            vm-results/*.png
            vm-results/*/terminal.log
            vm-results/*/version.log
            vm-results/*/preserved-version.log
            vm-results/*/RESULT.json

  packaged:
    if: inputs.phase == 'candidate' || inputs.phase == 'candidate-windows' || inputs.phase == 'candidate-focused'
    permissions:
      contents: write # Draft release assets require push access; the job only downloads.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.phase == 'candidate-windows' || inputs.phase == 'candidate-focused') && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest","macos-15-intel","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - name: Download the exact draft candidate and temporary test harness
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - name: Verify package, run original CLI regressions and MCP lifecycle tests
        env:
          KODER_ACCEPTANCE_FOCUSED: ${{ inputs.phase == 'candidate-focused' && '1' || '0' }}
        run: python .github/scripts/packaged-release-gates.py

  startup-repeat:
    if: inputs.phase == 'startup-repeat'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - run: python .github/scripts/windows-startup-repeat.py
  animation-repeat:
    if: inputs.phase == 'animation-repeat'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - run: python .github/scripts/windows-animation-repeat.py
  negative:
    if: inputs.phase == 'negative'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - run: python .github/scripts/native-installer-negatives.py
  published:
    if: inputs.phase == 'published'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python .github/scripts/public-readback.py
      - if: runner.os != 'Windows'
        run: python .github/scripts/public-linux-install.py
      - if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - if: runner.os == 'Windows'
        run: python .github/scripts/test-windows-installer.py --assets candidate --out public-windows-results --public-download

  diagnosis:
    if: inputs.phase == 'windows-diagnosis'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - run: python .github/scripts/windows-final-diagnosis.py
  app-diagnosis:
    if: inputs.phase == 'windows-app-diagnosis'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - run: python .github/scripts/windows-app-diagnosis.py

  animation-diagnosis:
    if: inputs.phase == 'animation-diagnosis'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - run: python .github/scripts/diagnose-animation-phases.py

  memory-public:
    if: inputs.phase == 'memory-public'
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pywinpty==3.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
        shell: bash
      - run: python .github/scripts/public-memory-recovery.py

  stable-candidate:
    if: inputs.phase == 'stable-candidate'
    permissions:
      contents: write # Only reads draft release assets; draft visibility requires this permission.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact stable draft and published preview baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate/new
          gh release download cli-0.4.0-preview.30 --repo "$GITHUB_REPOSITORY" --dir candidate/prior
      - name: Native installer and channel acceptance
        run: python .github/scripts/stable-installer-channel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-installer-${{ matrix.os }}
          path: stable-results/
