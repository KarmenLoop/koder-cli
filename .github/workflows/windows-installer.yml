name: Frozen 0.4.0 Windows cold and GUI acceptance
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Frozen verification suite
        type: choice
        default: components
        options: [components, native, full]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  gui:
    if: inputs.suite == 'components'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: x64
      - name: Fetch exact release
        run: python .github/probes/prepare-native.py --root "%RUNNER_TEMP%\koder-gui"
      - name: Install the pinned MCP dependency in the owned environment
        run: |
          python -m venv "%RUNNER_TEMP%\koder-gui\runtime"
          "%RUNNER_TEMP%\koder-gui\runtime\Scripts\python.exe" -m pip install --disable-pip-version-check --only-binary=:all: --timeout 20 --retries 1 --report "%RUNNER_TEMP%\koder-gui\install-report.json" windows-mcp==0.8.8
      - name: Verify standard GUI fixture dependency without opening a window
        run: '"%RUNNER_TEMP%\koder-gui\runtime\Scripts\python.exe" -c "import tkinter; print(tkinter.TkVersion, tkinter.TclVersion)"'
      - name: Actual Koder-mediated GUI interaction with owned targets
        run: '"%RUNNER_TEMP%\koder-gui\runtime\Scripts\python.exe" .github/probes/mcp-gui-r4.py --root "%RUNNER_TEMP%\koder-gui" --package "%RUNNER_TEMP%\koder-gui\assets\koder-cli-0.4.0.tgz" --sha256 86b6071c224437298a01e4b909d07fd1d91826b348fab181a8a50209eb390566 --version 0.4.0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/koder-gui/evidence
            ${{ runner.temp }}/koder-gui/install-report.json
          retention-days: 14
  native-credential:
    if: inputs.suite != 'full'
    # GitHub restricts draft release downloads to write-capable repository tokens.
    # This job only downloads and verifies the frozen draft; it never publishes.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: x64
      - name: Fetch unpublished component input
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download verify-windows-cold-20261024 --repo KarmenLoop/koder-cli --pattern credential-component.tgz --dir "%RUNNER_TEMP%\credential-component"
      - name: Verify and unpack the frozen candidate
        run: python -c "import hashlib,tarfile,pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'credential-component'; f=p/'credential-component.tgz'; assert hashlib.sha256(f.read_bytes()).hexdigest()=='285a59bdf209ebe7f301402241adb06d74e241a4296a9b36e0cf5bd58750ea6e'; tarfile.open(f).extractall(p/'source',filter='data')"
      - name: First native helper and independent persistence read
        run: node .github/probes/credential-native-r3.mjs --candidate-root "%RUNNER_TEMP%\credential-component\source" --manifest "%RUNNER_TEMP%\credential-component\source\frozen.json" --out "%RUNNER_TEMP%\credential-native-result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-credential-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/credential-native-result/receipt.json
            ${{ runner.temp }}/credential-native-result/*.raw
            ${{ runner.temp }}/credential-native-result/read-process/receipt.json
            ${{ runner.temp }}/credential-native-result/read-process/*.raw
          retention-days: 14
  upgrade:
    if: inputs.suite == 'components'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare exact published old and new inputs
        run: |
          python .github/probes/prepare-native.py --root "%RUNNER_TEMP%\upgrade-input"
          if errorlevel 1 exit /b %errorlevel%
          python .github/probes/prepare-prior.py --out "%RUNNER_TEMP%\upgrade-input\prior"
      - name: Verify frozen probe bytes after checkout
        run: python -c "from pathlib import Path; import hashlib; b=Path('.github/probes/windows-no-node-r2.py').read_bytes(); h=hashlib.sha256(b).hexdigest(); print(dict(sha256=h,bytes=len(b),lf=b.count(bytes([10])),crlf=b.count(bytes([13,10])))); assert h=='678d880abea327f1a2951aeb59468f3bc1551bef915d74c82863dfa48b9d08aa'"
      - name: Actual installed CLI update and complete installed-byte readback
        run: python .github/probes/windows-upgrade.py --previous-assets "%RUNNER_TEMP%\upgrade-input\prior" --assets "%RUNNER_TEMP%\upgrade-input\assets" --out "%RUNNER_TEMP%\upgrade-result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/upgrade-input/evidence
            ${{ runner.temp }}/upgrade-result/receipt.json
            ${{ runner.temp }}/upgrade-result/*.raw
          retention-days: 14

  full-package:
    if: inputs.suite == 'full'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: win-server-cmd, os: windows-latest, shell: cmd, python: python, mode: cold, entry: cmd, platform: win32, arch: x64}
          - {name: win-server-ps, os: windows-latest, shell: cmd, python: python, mode: cold, entry: powershell, platform: win32, arch: x64}
          - {name: win-server-update, os: windows-latest, shell: cmd, python: python, mode: upgrade, entry: powershell, platform: win32, arch: x64}
          - {name: win-arm-cmd, os: windows-11-arm, shell: cmd, python: python, mode: cold, entry: cmd, platform: win32, arch: arm64}
          - {name: win-arm-ps, os: windows-11-arm, shell: cmd, python: python, mode: cold, entry: powershell, platform: win32, arch: arm64}
          - {name: win-arm-update, os: windows-11-arm, shell: cmd, python: python, mode: upgrade, entry: powershell, platform: win32, arch: arm64}
          - {name: mac-arm, os: macos-15, shell: bash, python: python3, mode: both, entry: shell, platform: darwin, arch: arm64}
          - {name: mac-intel, os: macos-15-intel, shell: bash, python: python3, mode: both, entry: shell, platform: darwin, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download frozen unpublished package inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download verify-windows-cold-20261024 --repo KarmenLoop/koder-cli --pattern full-candidate-2-inputs.tgz --dir candidate-input-download
      - name: Verify exact bundle and unpack only ten allowlisted files
        run: ${{ matrix.python }} .github/probes/unpack-candidate-2.py
      - name: No-Node install and original installed CLI update
        run: ${{ matrix.python }} .github/probes/run-candidate-2.py ${{ matrix.mode }} ${{ matrix.entry }} ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate2-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/candidate-2-*/receipt.json
            ${{ runner.temp }}/candidate-2-*/*.raw
          retention-days: 14
  candidate-gui:
    if: inputs.suite == 'full'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: x64
      - name: Download frozen unpublished package inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download verify-windows-cold-20261024 --repo KarmenLoop/koder-cli --pattern full-candidate-2-inputs.tgz --dir candidate-input-download
      - name: Verify exact inputs
        run: python .github/probes/unpack-candidate-2.py
      - name: Prepare owned MCP runtime
        run: |
          python -m venv "%RUNNER_TEMP%\candidate-gui\runtime"
          "%RUNNER_TEMP%\candidate-gui\runtime\Scripts\python.exe" -m pip install --disable-pip-version-check --only-binary=:all: --timeout 20 --retries 1 --report "%RUNNER_TEMP%\candidate-gui\install-report.json" windows-mcp==0.8.8
      - name: Candidate original Agent GUI interaction
        run: '"%RUNNER_TEMP%\candidate-gui\runtime\Scripts\python.exe" .github/probes/mcp-gui-r4.py --root "%RUNNER_TEMP%\candidate-gui" --package "%RUNNER_TEMP%\full-candidate-2-input\candidate\koder-cli-0.4.1-candidate.2.tgz" --sha256 503214467fbe3e5585bd5471e96b0636616a1be530e8908e3a1b223cb2583c94 --version 0.4.1-candidate.2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate2-gui-server
          path: |
            ${{ runner.temp }}/candidate-gui/evidence
            ${{ runner.temp }}/candidate-gui/install-report.json
          retention-days: 14
