name: Windows login storage acceptance
on:
  push:
    branches: [acceptance/windows-login-storage]
    paths: [.github/workflows/windows-login-storage.yml, test/acceptance/windows-login-storage.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test/acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official package and verify exact bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://kodermodule.com/packages/cli/cli-0.8.4/f4eec29a09c41019/koder-cli-0.8.4.tgz'
          $archive = Join-Path $env:RUNNER_TEMP 'koder-acceptance.tgz'
          curl.exe --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'OFFICIAL_DOWNLOAD_FAILED' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '97b5ec4ba6b81b8f2f361402cb355966132f3586be42ea5d181f2c31d1331c83') { throw 'PACKAGE_HASH_MISMATCH' }
          $installer = Join-Path $env:RUNNER_TEMP 'koder-cli.ps1'
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 120 --output $installer 'https://kodermodule.com/packages/cli/cli-0.8.4/f4eec29a09c41019/koder-cli.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'INSTALLER_DOWNLOAD_FAILED' }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd3fca32519b86d9488df8a46f1b2d2798576e75ac3b4fa6593c37b31a5ee9127') { throw 'INSTALLER_HASH_MISMATCH' }
          # Exercise the shipping installer's Unicode-safe extractor; Windows tar
          # does not accept every long filename in the full package.
          $installerText = [IO.File]::ReadAllText($installer)
          $encoded = ([regex]::Matches($installerText, '(?m)^''([A-Za-z0-9+/=]+)''(?: \+)?\r?$') | ForEach-Object { $_.Groups[1].Value }) -join ''
          if (-not $encoded) { throw 'INSTALLER_WRAPPER_INVALID' }
          $installerText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $match = [regex]::Match($installerText, '(?ms)^\$ExtractJs = @''\r?\n(.*?)\r?\n''@')
          if (-not $match.Success) { throw 'INSTALLER_EXTRACTOR_MISSING' }
          $extract = Join-Path $env:RUNNER_TEMP 'koder-extract.cjs'
          [IO.File]::WriteAllText($extract, $match.Groups[1].Value)
          $dest = Join-Path $env:RUNNER_TEMP 'koder-package\koder-cli'
          New-Item $dest -ItemType Directory -Force | Out-Null
          node $extract $archive $dest
          if ($LASTEXITCODE -ne 0) { throw 'PACKAGE_EXTRACT_FAILED' }
          "KODER_ACCEPTANCE_PACKAGE=$dest" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise real CurrentUser DPAPI with synthetic credentials
        shell: powershell
        run: node test/acceptance/windows-login-storage.mjs
      - name: Save sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-login-storage
          path: evidence/windows-login-storage.json
          if-no-files-found: ignore
          retention-days: 14

