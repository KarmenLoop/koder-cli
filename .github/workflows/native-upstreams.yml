name: Windows 11 ARM actual MCP acceptance
on:
  push:
    branches: [verify/windows11-native-20261023]
    paths: [.github/workflows/native-upstreams.yml, .github/scripts/native-upstreams.py]
permissions:
  contents: read
jobs:
  windows-mcp:
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Verify the actual client OS before any acceptance
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000 -or $os.Caption -notmatch 'Windows 11') { throw 'Expected a Windows 11 client, not Windows Server' }
          $root = Join-Path $env:RUNNER_TEMP 'Koder Native 验收'
          New-Item -ItemType Directory -Force "$root/evidence" | Out-Null
          $os | Select-Object Caption,Version,BuildNumber,OSArchitecture,ProductType | ConvertTo-Json | Set-Content -Encoding UTF8 "$root/evidence/client-os.json"
      - name: Install the pinned upstream into a disposable venv
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Koder Native 验收'
          New-Item -ItemType Directory -Force $root | Out-Null
          python -m venv "$root/runtime"
          & "$root/runtime/Scripts/python.exe" -m pip install --only-binary=:all: --timeout 20 --retries 1 --disable-pip-version-check --progress-bar off --report "$root/install-report.json" windows-mcp==0.8.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual stdio calls and published Koder connection
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Koder Native 验收'
          & "$root/runtime/Scripts/python.exe" .github/scripts/native-upstreams.py --root "$root"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows11-arm-mcp-results
          path: ${{ runner.temp }}/Koder Native 验收/evidence/
          retention-days: 7
          if-no-files-found: warn
