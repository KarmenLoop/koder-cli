name: Windows learning directory path diagnosis
on:
  push:
    branches: [acceptance/learning-startup-0513]
    paths: [".github/workflows/windows-learning.yml"]
permissions:
  contents: read
jobs:
  paths:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Record mkdir and canonical path spellings
        shell: pwsh
        run: |
          @'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path');
          const root=fs.realpathSync(fs.mkdtempSync(path.join(os.tmpdir(),'learning-path-')));
          try {
            const rows=[];
            for(const rel of ['_ops/locks/claims','_ops/staging/s/projects/p','_ops/transactions','projects/p']) {
              const dir=path.join(root,rel), first=fs.mkdirSync(dir,{recursive:true});
              rows.push({dir,first,relative:first?path.relative(first,dir):null,
                realDir:fs.realpathSync(dir),realFirst:first?fs.realpathSync(first):null,
                nativeDir:fs.realpathSync.native(dir),nativeFirst:first?fs.realpathSync.native(first):null});
            }
            console.log(JSON.stringify({root,rows},null,2));
          } finally { fs.rmSync(root,{recursive:true,force:true}); }
          '@ | node
