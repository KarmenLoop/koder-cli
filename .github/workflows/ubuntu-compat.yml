name: Ubuntu full runtime and accessible desktop
on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact draft or published release tag
        required: true
        default: cli-0.5.10
  push:
    branches: [acceptance/ubuntu-058]
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        display: [x11, wayland]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write # GitHub draft asset downloads need write access; no upload or repo write step.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install dependencies in the disposable runner
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core dbus-x11 libnotify-bin xvfb x11-utils openbox dunst weston sway mako-notifier
      - name: Download exact release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release || 'cli-0.5.10' }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern "koder-cli-${RELEASE_TAG#cli-}-linux.tgz" --pattern 'koder-cli-latest.json' --pattern 'koder-cli.sh' --pattern 'koder-ubuntu-24.04.sh'
          printf 'KODER_TEST_VERSION=%s\n' "${RELEASE_TAG#cli-}" >> "$GITHUB_ENV"
      - name: Full package, managed Node, reinstallation and CLI features
        run: python3 .github/scripts/ubuntu-runtime-check.py
      - name: Actual accessible controls and notification adapter
        env:
          KODER_DISPLAY_TEST: ${{ matrix.display }}
        run: dbus-run-session -- bash .github/scripts/ubuntu-desktop-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-${{ matrix.runner }}-${{ matrix.display }}
          path: ubuntu-results/
          retention-days: 14
