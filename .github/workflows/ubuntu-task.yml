name: Ubuntu interactive task acceptance
on:
  push:
    branches: [acceptance/ubuntu-task-0512]
  workflow_dispatch:
    inputs:
      release:
        description: Exact draft or published release tag
        required: true
        default: cli-0.5.12
permissions:
  contents: read
jobs:
  task:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    permissions:
      contents: write # Download draft release assets; this job does not publish.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Download the exact Linux runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release || 'cli-0.5.12' }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern "koder-cli-${RELEASE_TAG#cli-}-linux.tgz" --pattern koder-cli-latest.json
      - name: Submit a task in a real pseudo-terminal
        run: python3 .github/scripts/ubuntu-task-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-${{ matrix.runner }}
          path: ubuntu-task-results/
          retention-days: 14
