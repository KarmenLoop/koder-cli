<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区读书会 · 本地教学演示</title><style>body{font:18px/1.7 system-ui,sans-serif;margin:0;background:#f6f5ef;color:#1d302a}main{max-width:760px;margin:auto;padding:32px 20px}label{display:block;margin-top:16px}input,select,button{font:inherit;padding:10px;box-sizing:border-box;max-width:100%;border:1px solid #697b70;border-radius:4px}input,select{width:100%}button{margin-top:20px;background:#204c3d;color:white}button:disabled{opacity:.6}*:focus-visible{outline:3px solid #b26d00;outline-offset:3px}#status{padding:12px;border-left:3px solid #507e68}small{display:block}</style></head><body><main><p>ACADEMY / SYNTHETIC PROJECT</p><h1>一起读完一本好书</h1><p>这是社区读书会的合成练习页，日期、地点和活动安排待确认。下面的表单仅本地演示，不联网、不保存个人资料、不发送邮件。</p><h2>报名流程演示</h2><form id="signup" novalidate><label for="name">姓名（请用虚构名字）</label><input id="name" name="name" autocomplete="off" required maxlength="80"><label for="email">练习邮箱</label><input id="email" name="email" type="email" autocomplete="off" placeholder="learner@example.com" required><label for="scenario">本次模拟结果</label><select id="scenario"><option value="success">成功演示</option><option value="failed">网络失败演示</option><option value="unknown">结果未知演示</option></select><button id="submit" type="submit">运行本地演示</button><p id="status" role="status" aria-live="polite">尚未开始；没有远程报名服务。</p></form><small>源码可作为第79–87课的阅读与改写素材。不要移除演示说明后冒充真实报名。</small></main><script>
const form=document.getElementById('signup'),status=document.getElementById('status'),button=document.getElementById('submit');
form.addEventListener('submit',async event=>{event.preventDefault();const name=document.getElementById('name'),email=document.getElementById('email');if(!name.value.trim()){status.textContent='请填写虚构姓名。';name.focus();return;}if(!email.validity.valid){status.textContent='请填写格式完整的练习邮箱，例如learner@example.com。';email.focus();return;}button.disabled=true;status.textContent='正在运行本地状态演示……';await new Promise(resolve=>setTimeout(resolve,250));const choice=document.getElementById('scenario').value;status.textContent=choice==='success'?'本地校验通过。仅演示成功状态，没有发送到服务器。':choice==='failed'?'模拟网络失败。输入仍保留；没有发送真实请求。':'模拟结果未知。真实场景应先核对回执，避免重复提交；本演示没有发送请求。';button.disabled=false;});
</script></body></html>
